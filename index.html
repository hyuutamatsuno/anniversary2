<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>合言葉を入力してね</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f6f4ec; color: #4a4a3a; font-family: "Yu Gothic", "Hiragino Sans", sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.12); padding: 32px 24px; width: 100%; max-width: 820px; text-align: center; }
  h1 { font-size: 20px; color: #7a7d3a; margin: 0 0 8px; }
  p { line-height: 1.8; margin: 8px 0; }
  form { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  input { font-size: 22px; padding: 10px 14px; border: 2px solid #c8c49a; border-radius: 10px; width: min(100%, 360px); text-align: center; }
  button { font-size: 18px; padding: 10px 22px; background: #f2d98a; border: none; border-radius: 10px; font-weight: 700; color: #6b5a1a; cursor: pointer; }
  .msg { min-height: 1.8em; color: #b04a3a; font-weight: 700; }
  .player { position: relative; width: 100%; padding-top: 56.25%; margin-top: 16px; border-radius: 10px; overflow: hidden; background: #000; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div id="lock">
    <h1>2nd Wedding Anniversary</h1>
    <p>謎解きで見つけた<b>合言葉</b>を入力してね。</p>
    <form id="form">
      <input id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉" aria-label="合言葉">
      <button type="submit">開く</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>
  <div id="unlocked" class="hidden">
    <h1>正解！ 1年分のありがとうを、動画にしました</h1>
    <p>HYUTA ＆ AYANO より</p>
    <div class="player" id="player"></div>
  </div>
</div>
<script>
const BOX = {"salt": "rnacjVrd3PzS20Uymw7p0g==", "iv": "3P7qAJaD5KrOs6ju", "ct": "Gx4/gM/s5CfAEw4qgtHGMQxMGveKzTZj4GUV", "iter": 200000};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function normalize(s) {
  return s.normalize("NFKC").trim().toLowerCase().replace(/\s+/g, "")
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
async function unlock(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(BOX.salt), iterations: BOX.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BOX.iv) }, key, b64(BOX.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const v = normalize(document.getElementById("pw").value);
  if (!v) { msg.textContent = ""; return; }
  if (!window.crypto || !crypto.subtle) { msg.textContent = "このページは https で開いてね。"; return; }
  msg.textContent = "…";
  try {
    const id = await unlock(v);
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("unlocked").classList.remove("hidden");
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + id + "?rel=0&playsinline=1";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    document.getElementById("player").appendChild(f);
  } catch (err) {
    msg.textContent = "ちがうみたい… もう一度考えてみてね。";
  }
});
</script>
</body>
</html>
